name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-pip python3-venv \
            libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev \
            openjdk-17-jdk unzip
          pip install buildozer cython

      - name: Compilar APK
        run: cd android_app && export JAVA_HOME=$JAVA_HOME_17_X64 && echo "pip==24.0" > /tmp/pip-constraint.txt && export PIP_CONSTRAINT=/tmp/pip-constraint.txt && buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android_app/bin/*.apk
